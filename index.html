<!doctype html>
<html>
  <head>
    <title>Did my pony get wet?</title>

    <link rel="stylesheet" href="/tailwind.css" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Wet pony?" />

    <!-- Sets the status bar color to black -->
    <meta name="theme-color" content="#06b6d4" />
  </head>

  <body class="bg-cyan-600">
    <div class="flex justify-center min-h-screen">
      <div class="m-20 text-center">
        <div id="answer-group">
          <p id="did-it-rain" class="text-9xl font-bold"></p>
          <p id="how-much" class="text-5xl font-bold mt-2"></p>
          <div id="prediction-group" class="m-10">
            <p id="rain-soon" class="text-7xl font-bold"></p>
            <p id="how-much-upcoming" class="text-5xl font-bold mt-2"></p>
          </div>

          <div class="col-auto grid grid-cols-2 text-5xl font-bold">
            <div class="left border-r border-cyan-900 px-5">
              <p id="last-rain" class="text-right"></p>
            </div>
            <div class="right px-5">
              <p id="next-rain" class="text-left"></p>
            </div>
          </div>

          <p id="current-status" class="text-4xl font-bold mt-10"></p>
        </div>

        <div id="error-group">
          <p id="error" class="text-5xl italic mt-2"></p>
          <p id="error-details" class="text-xl italic mt-2"></p>
        </div>

        <button
          id="button"
          style="display: none"
          class="m-10 bg-pink-700 text-black text-5xl font-semibold py-3 px-6 rounded-lg shadow-xl hover:bg-pink-600 focus:outline-none focus:ring-2 focus:pink-400"
          onclick="openWeatherApp()"
        >
          Check Weather
        </button>
      </div>
    </div>

    <script>
      const pastDays = 7;
      const futureDays = 16;

      loadWeather();

      function loadWeather() {
        fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=37.477871&longitude=-122.420851&daily=precipitation_sum,precipitation_hours,precipitation_probability_max&hourly=precipitation&current=temperature_2m,weather_code,wind_speed_10m,wind_gusts_10m,is_day&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FLos_Angeles&past_days=${pastDays}&forecast_days=${futureDays}`,
        )
          .then((response) => response.json())
          .then((data) => {
            console.log(data);
            render(data, new Date());
          })
          .catch(showError);
      }

      function render(data, now) {
        document.getElementById("answer-group").style.display = "block";
        document.getElementById("button").style.display = "inline";
        document.getElementById("error-group").style.display = "none";

        const yesterdaysPrecipitation =
          data.daily.precipitation_sum[pastDays - 1] || 0;
        const today = data.daily.time[pastDays];
        const todaysRain = splitTodaysRain(data.hourly, today, now);

        const strings = generateIsPonyWetStrings(
          yesterdaysPrecipitation,
          todaysRain,
          now.getHours(),
        );

        document.getElementById("did-it-rain").textContent = strings[0];
        document.getElementById("how-much").textContent = strings[1];
        document.getElementById("rain-soon").textContent = strings[2];
        document.getElementById("how-much-upcoming").textContent = strings[3];

        // Last rain: the most recent rainy day before the one the top section
        // describes. Once it has rained today, the top is about today, so
        // start from yesterday; otherwise the top is about yesterday, so
        // start from the day before.
        let lastRain = null;
        let lastAmount = 0;
        const lastStart = todaysRain.soFar > 0 ? pastDays - 1 : pastDays - 2;
        for (let i = lastStart; i >= 0; i--) {
          if (data.daily.precipitation_sum[i] > 0) {
            lastRain = data.daily.time[i];
            lastAmount = data.daily.precipitation_sum[i];
            break;
          }
        }
        const lastRainText = generateLastRainString(lastRain, lastAmount, now);
        document.getElementById("last-rain").textContent = lastRainText;

        // Next rain: the first rainy day after today. Any rain still coming
        // today is already described in the top section.
        let nextRain = null;
        let nextAmount = 0;
        for (let i = pastDays + 1; i < pastDays + futureDays; i++) {
          if (data.daily.precipitation_sum[i] > 0) {
            nextRain = data.daily.time[i];
            nextAmount = data.daily.precipitation_sum[i];
            break;
          }
        }
        const nextRainText = generateNextRainString(nextRain, nextAmount, now);
        document.getElementById("next-rain").textContent = nextRainText;

        document.getElementById("current-status").textContent = data.current
          ? generateCurrentStatusString(data.current)
          : "";
      }

      function showError(error) {
        console.error("Error fetching data:", error);

        document.getElementById("answer-group").style.display = "none";
        document.getElementById("error-group").style.display = "block";
        document.getElementById("button").style.display = "inline";

        document.getElementById("error").textContent =
          `I don't know! Something went wrong.`;
        document.getElementById("error-details").textContent = `${error}`;
      }

      // Split today's hourly rain into what has already fallen and what is
      // still forecast. Open-Meteo stamps each hour with its end time, so the
      // "21:00" entry is the rain that fell between 8pm and 9pm.
      function splitTodaysRain(hourly, today, now) {
        let soFar = 0;
        let later = 0;
        let firstRainHour = null;
        const currentHour = now.getHours();

        hourly.time.forEach((time, i) => {
          if (!time.startsWith(today)) return;
          const hourEnd = Number(time.slice(11, 13));
          const amount = hourly.precipitation[i] || 0;
          if (hourEnd <= currentHour) {
            soFar += amount;
          } else {
            later += amount;
            if (amount > 0 && firstRainHour === null) {
              firstRainHour = hourEnd - 1;
            }
          }
        });

        return { soFar: round3(soFar), later: round3(later), firstRainHour };
      }

      // Round away floating-point noise from summing hourly values, while
      // keeping the smallest reported amounts (0.004 inches).
      function round3(x) {
        return Math.round(x * 1000) / 1000;
      }

      // How much rain, by level: "rain" is 0.1 inches or more, "drizzle" is
      // 0.01 to 0.1, and "drops" is anything less.
      function rainLevel(amount) {
        if (amount >= 0.1) return "rain";
        if (amount >= 0.01) return "drizzle";
        if (amount > 0) return "drops";
        return "none";
      }

      // Words for the bottom row: "", "a drizzle ", or "just a few drops ".
      function rainKind(amount) {
        const level = rainLevel(amount);
        if (level === "drizzle") return "a drizzle ";
        if (level === "drops") return "just a few drops ";
        return "";
      }

      function inches(amount) {
        if (amount < 0.01) return "less than 0.01 inches";
        const rounded = Math.round(amount * 100) / 100;
        return `${rounded} ${rounded === 1 ? "inch" : "inches"}`;
      }

      function capitalize(text) {
        return text.charAt(0).toUpperCase() + text.slice(1);
      }

      // When, later today, the rain starts.
      function whenToday(hour) {
        if (hour < 12) return "this morning";
        if (hour < 17) return "this afternoon";
        if (hour < 21) return "this evening";
        return "tonight";
      }

      function openWeatherApp() {
        window.open(
          `https://www.wunderground.com/hourly/us/ca/half-moon-bay`,
          "_self",
        );
      }

      function getDayFromDate(date) {
        const daysOfWeek = [
          "Sunday",
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
        ];

        const dayOfWeek = date.getDay();
        return daysOfWeek[dayOfWeek];
      }

      function getDayWithSuffix(day) {
        let suffix = "th";
        if (day === 1 || day === 21 || day === 31) {
          suffix = "st";
        } else if (day === 2 || day === 22) {
          suffix = "nd";
        } else if (day === 3 || day === 23) {
          suffix = "rd";
        }

        return day + suffix;
      }

      // Parse a "YYYY-MM-DD" string as local midnight, so the day math
      // works in both standard and daylight time.
      function parseLocalDate(dateString) {
        const [year, month, day] = dateString.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function startOfDay(now) {
        return new Date(now.getFullYear(), now.getMonth(), now.getDate());
      }

      function generateLastRainString(lastRainDate, amount, now) {
        if (lastRainDate == null) {
          return `the last rain was over ${pastDays} days ago!`;
        }

        const date = parseLocalDate(lastRainDate);
        const daySuffix = getDayWithSuffix(date.getDate());
        const lastRainDay = getDayFromDate(date);

        // How many days ago was the last rain day?
        const daysAgo = Math.round(
          (startOfDay(now) - date) / (1000 * 3600 * 24),
        );

        if (daysAgo == 1) {
          return `the last rain was ${rainKind(amount)}yesterday`;
        }
        return `the last rain was ${rainKind(amount)}${daysAgo} days ago, on ${lastRainDay} the ${daySuffix}`;
      }

      function generateNextRainString(nextRainDate, amount, now) {
        if (nextRainDate == null) {
          return `next rain is over ${futureDays} days away!`;
        }

        const date = parseLocalDate(nextRainDate);
        const daySuffix = getDayWithSuffix(date.getDate());
        const nextRainDay = getDayFromDate(date);

        // How many days in the future is the next rain day?
        const daysAhead = Math.round(
          (date - startOfDay(now)) / (1000 * 3600 * 24),
        );

        if (daysAhead == 1) {
          return `the next rain will be ${rainKind(amount)}tomorrow`;
        }
        return `the next rain will be ${rainKind(amount)}in ${daysAhead} days, on ${nextRainDay} the ${daySuffix}`;
      }

      // e.g. "current status: cool, foggy, breezy"
      function generateCurrentStatusString(current) {
        const parts = [describeTemperature(current.temperature_2m)];
        const conditions = describeConditions(current.weather_code, current.is_day);
        if (conditions) parts.push(conditions);
        parts.push(describeWind(current.wind_speed_10m, current.wind_gusts_10m));
        return `current status: ${parts.join(", ")}`;
      }

      // Temperature in words, from the actual temperature in °F.
      function describeTemperature(temperature) {
        if (temperature < 32) return "freezing";
        if (temperature < 45) return "cold";
        if (temperature < 55) return "chilly";
        if (temperature < 65) return "cool";
        if (temperature < 75) return "comfortable";
        if (temperature < 85) return "warm";
        return "hot";
      }

      // Open-Meteo weather codes (WMO), in plain words.
      function describeConditions(code, isDay) {
        if (code === 0) return isDay ? "sunny" : "clear";
        if (code === 1) return isDay ? "mostly sunny" : "mostly clear";
        if (code === 2) return "partly cloudy";
        if (code === 3) return "cloudy";
        if (code === 45 || code === 48) return "foggy";
        if (code >= 51 && code <= 57) return "drizzling";
        if (code === 65) return "pouring";
        if (code >= 61 && code <= 67) return "raining";
        if (code >= 71 && code <= 77) return "snowing";
        if (code >= 80 && code <= 82) return "showers";
        if (code === 85 || code === 86) return "snowing";
        if (code >= 95) return "thunderstorms";
        return "";
      }

      // Wind in words, from the steady speed in mph. Strong gusts on a day
      // that is otherwise less than super windy read as "gusty".
      function describeWind(speed, gusts) {
        if (speed >= 25) return "super windy";
        if (gusts >= 30) return "gusty";
        if (speed >= 15) return "windy";
        if (speed >= 5) return "breezy";
        return "calm";
      }

      function generateIsPonyWetStrings(yesterday, todaysRain, hour) {
        // Return a 4-string array:
        // Did she get wet (today so far, or else yesterday)?
        // How much rain fell?
        // What happens for the rest of today?
        // How much more rain is coming today?
        const strings = new Array(4).fill("");
        const { soFar, later, firstRainHour } = todaysRain;
        const evening = hour >= 17;
        // Once it has rained today, the top is about today only (yesterday
        // moves to the bottom row). Otherwise it is about yesterday.
        const rainedToday = soFar > 0;
        const wetAmount = rainedToday ? soFar : yesterday;
        const wetLevel = rainLevel(wetAmount);
        const laterLevel = rainLevel(later);
        const dayLabel = rainedToday
          ? later > 0
            ? "so far today"
            : "today"
          : "yesterday";
        const when = whenToday(firstRainHour);

        if (wetLevel !== "none") {
          if (wetLevel === "rain") {
            strings[0] = "Yep!";
            strings[1] = `${inches(wetAmount)} of rain ${dayLabel}!`;
          } else if (wetLevel === "drizzle") {
            strings[0] = "A little!";
            strings[1] = `Just ${inches(wetAmount)} ${dayLabel}.`;
          } else {
            strings[0] = "Barely!";
            strings[1] = `${capitalize(inches(wetAmount))} ${dayLabel}.`;
          }

          if (laterLevel === "rain") {
            strings[2] = `And it's not over:`;
            strings[3] = `${inches(later)} more ${when}!`;
          } else if (laterLevel === "drizzle") {
            strings[2] = `And a little more is coming:`;
            strings[3] = `${inches(later)} ${when}.`;
          } else if (laterLevel === "drops") {
            strings[2] = `And maybe a few more drops ${when}.`;
          } else if (soFar > 0) {
            strings[2] = evening
              ? `The rain is done for today.`
              : `But the rain is done for today.`;
          } else {
            strings[2] = evening
              ? `But she stayed dry today!`
              : `But she will dry out today!`;
          }
        } else if (laterLevel !== "none") {
          strings[0] = "Not yet!";
          if (laterLevel === "rain") {
            strings[2] = `But she will soon:`;
            strings[3] = `${inches(later)} of rain ${when}!`;
          } else if (laterLevel === "drizzle") {
            strings[2] = `But she might get a little damp:`;
            strings[3] = `${inches(later)} ${when}.`;
          } else {
            strings[2] = `But she might feel a few drops ${when}.`;
          }
        } else {
          strings[0] = "Nope!";
          strings[2] = evening
            ? `And she stayed dry all day!`
            : `And she will stay dry today too!`;
        }
        return strings;
      }
    </script>
  </body>
</html>
